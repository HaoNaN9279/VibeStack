[project]
name = "vibe-stack"
version = "0.3.0"
description = "Capability groups and tools for multiple AI agent tools"
requires-python = ">=3.11"
authors = [{ name = "VibeStack contributors" }]

[project.scripts]
vibe-stack = "vibe_stack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibe_stack"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
